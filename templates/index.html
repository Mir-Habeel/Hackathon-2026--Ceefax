<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101214">
  <title>Ceefax — Live UK information</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <a class="brand" href="#100" data-page="100" aria-label="Ceefax home"><span class="brand-mark"></span>ceefax<span>2026</span></a>
      <div class="header-meta"><span class="live-dot"></span><span>LIVE UK DATA</span><time id="clock"></time></div>
      <form class="page-jump" id="pageForm"><label for="pageInput">PAGE</label><input id="pageInput" value="100" maxlength="3" inputmode="numeric" aria-label="Page number"><button type="submit">Go</button></form>
    </header>
    <nav class="page-nav" aria-label="Main pages">
      <button data-page="100">Overview</button><button data-page="101">News</button><button data-page="401">Weather</button><button data-page="501">Transport</button><button data-page="601">Energy</button><button data-page="801">Sport</button>
    </nav>
    <main id="view" class="content" aria-live="polite"></main>
    <footer><span>CEEFAX 2026</span><span>LIVE INFORMATION, CLEARLY PRESENTED</span><button id="refresh" type="button">Refresh data</button></footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
